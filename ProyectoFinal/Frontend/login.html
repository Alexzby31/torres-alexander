<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700;800;900&display=swap">
    <link rel="stylesheet" href="./css/main.css">
    <title>Login</title>
</head>
<body>
    <section class="registro-section">
        <h2 class="titulo-principal">Login</h2>
        <form id="loginForm" class="formulario-registro">
            <label for="username">Username</label>
            <input type="text" placeholder="Ingrese su nombre de usuario" id="username" required autofocus>
            
            <label for="password">Password</label>
            <input type="password" placeholder="Ingrese su contraseña" id="password" required>
            
            <input type="submit" value="Ingresar" class="boton-agregar">
        </form>
        <p class="texto-footer">¿No tienes una cuenta? <a href="signup.html">Registro</a></p>
    </section>
    <script src="js/login.js"></script>
</body>
</html>
