<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700;800;900&display=swap">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.9.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="./css/main.css">
    <title>Perfil de Usuario</title>
</head>
<body>
    <div class="wrapper">
        <aside>
            <header>
                <h1 class="logo">Laundry Service</h1>
            </header>
            <nav>
                <ul class="menu">
                    <li><a href="index.html" class="boton-menu">Inicio</a></li>
                    <li><a href="perfil.html" class="boton-menu active">Perfil</a></li>
                </ul>
            </nav>
        </aside>
        <main>
            <section class="registro-section">
                <h2 class="titulo-principal">Perfil de Usuario</h2>
                <form id="profile-form" class="formulario-registro">
                    <div class="form-group">
                        <label for="username">Nombre de Usuario:</label>
                        <input type="text" id="username" name="username" placeholder="Nuevo nombre de usuario" required>
                    </div>
                    <div class="form-group">
                        <label for="new-password">Nueva Contraseña:</label>
                        <input type="password" id="new-password" name="new-password" placeholder="Nueva contraseña" required>
                    </div>
                    <div class="form-group">
                        <label for="confirm-password">Confirmar Contraseña:</label>
                        <input type="password" id="confirm-password" name="confirm-password" placeholder="Confirmar contraseña" required>
                    </div>
                    <input type="submit" value="Guardar Cambios" class="boton-agregar">
                </form>
            </section>
        </main>
    </div>
    <script src="js/perfil.js"></script>
</body>
</html>
