<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700;800;900&display=swap">
    <link rel="stylesheet" href="./css/main.css">
    <title>Registro</title>
</head>
<body>
    <section class="registro-section">
        <h2 class="titulo-principal">Registro</h2>
        <form id="signupForm" class="formulario-registro">
            <label for="name">Nombre</label>
            <input type="text" placeholder="Ingresa tu nombre" id="name" required autofocus>
            <label for="username">Username</label>
            <input type="text" placeholder="Ingresa tu username" id="username" required>
            <label for="password">Password</label>
            <input type="password" placeholder="Ingresa tu contraseña" id="password" required>
            <input type="submit" value="Registro" class="boton-agregar">
        </form>
        <p class="texto-footer">¿Ya tienes una cuenta? <a href="login.html">Login</a></p>
    </section>
    <script src="js/signup.js"></script>
</body>
</html>
